# ─────────────────────────────────────────────
# Sveltia / Decap CMS – SG Köln-Worringen
# Admin-URL: /admin/
# ─────────────────────────────────────────────

backend:
  name: github
  repo: Stefaku1986/sg-worringen-website
  branch: main
  base_url: https://sveltia-cms-auth.st-kuehl86.workers.dev

# Medien-Uploads in den public/images Ordner
media_folder: public/images/news
public_folder: /images/news

# Basis-URL (wichtig für GitHub Pages Subdirectory)
site_url: https://www.sg-fussball.online

collections:

  # ── Neuigkeiten ──────────────────────────────
  - name: news
    label: Neuigkeiten
    label_singular: Neuigkeit
    description: "Aktuelle News und Spielberichte des Vereins"
    files:
      - name: all_news
        label: Alle Neuigkeiten
        file: data/news.json
        description: "Neuigkeiten bearbeiten"
        fields:
          - name: items
            label: Neuigkeiten
            widget: list
            summary: "{{fields.title}} ({{fields.dateDisplay}})"
            fields:
              - { name: id,          label: ID (eindeutig),  widget: string }
              - { name: title,       label: Überschrift,     widget: string }
              - { name: dateDisplay, label: Datum (Anzeige), widget: string, hint: "z.B. 15. Mai 2025" }
              - { name: date,        label: Datum (intern),  widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
              - { name: text,        label: Text,            widget: text }
              - name: images
                label: Bilder (optional)
                widget: list
                required: false
                fields:
                  - { name: src, label: Bilddatei, widget: image }
                  - { name: alt, label: Alt-Text,  widget: string }

  # ── Mannschaften (Kader & Trainingszeiten) ───
  - name: teams
    label: Mannschaften
    label_singular: Mannschaft
    description: "Kader, Staff und Trainingszeiten aller Mannschaften"
    files:
      - name: all_teams
        label: Alle Mannschaften
        file: data/players.json
        fields:
          - name: teams
            label: Mannschaften
            widget: object
            fields:

              # ── Senioren ──
              - name: 1-senioren
                label: "1. Seniorenmannschaft"
                widget: object
                fields: &team_fields
                  - { name: name,      label: Name,      widget: string }
                  - { name: shortName, label: Kurzname,   widget: string }
                  - { name: season,    label: Saison,     widget: string, hint: "z.B. 2025/2026" }
                  - name: staff
                    label: Staff (Trainer etc.)
                    widget: list
                    required: false
                    summary: "{{fields.name}} – {{fields.role}}"
                    fields:
                      - { name: name,     label: Name,     widget: string }
                      - { name: role,     label: Rolle,    widget: string, hint: "z.B. Trainer, Co-Trainer" }
                      - { name: number,   label: Nummer,   widget: number, required: false, value_type: int }
                      - { name: position, label: Position, widget: string, hint: "TR, CO, BT" }
                      - { name: image,    label: Bild,     widget: image, required: false }
                      - { name: since,    label: Seit,     widget: string, required: false, hint: "z.B. 2023" }
                      - { name: phone,    label: Telefon,  widget: string, required: false, hint: "z.B. 0157 12345678" }
                      - { name: email,    label: E-Mail,   widget: string, required: false, hint: "z.B. name@sg-fussball.online" }
                      - { name: qualification, label: Qualifikation, widget: string, required: false, hint: "z.B. DFB-Trainerlizenz C" }
                  - name: players
                    label: Spieler
                    widget: list
                    required: false
                    summary: "{{fields.number}} – {{fields.name}} ({{fields.position}})"
                    fields:
                      - { name: name,     label: Name,     widget: string }
                      - { name: number,   label: Nummer,   widget: number, value_type: int }
                      - { name: position, label: Position, widget: string, hint: "TW, IV, LV, RV, ZM, OM, ST, LA, RA" }
                      - { name: image,    label: Bild,     widget: image, required: false }
                  - name: trainingTimes
                    label: Trainingszeiten
                    widget: list
                    required: false
                    fields:
                      - { name: days, label: Tag(e), widget: string, hint: "z.B. Dienstag und Donnerstag" }
                      - { name: from, label: Von,    widget: string, hint: "z.B. 16:30" }
                      - { name: to,   label: Bis,    widget: string, hint: "z.B. 18:00" }

              - name: alte-herren
                label: "Alte Herren"
                widget: object
                fields: *team_fields

              # ── Jugend ──
              - name: b-junioren-2009
                label: "B-Junioren 2009 (U17)"
                widget: object
                fields: *team_fields

              - name: c-junioren-2010
                label: "C-Junioren 2010 (U16)"
                widget: object
                fields: *team_fields

              - name: c-junioren-2011
                label: "C-Junioren 2011 (U15)"
                widget: object
                fields: *team_fields

              - name: d-junioren-2013
                label: "D-Junioren 2013 (U13)"
                widget: object
                fields: *team_fields

              - name: e-junioren-2015
                label: "E-Junioren 2015 (U11)"
                widget: object
                fields: *team_fields

              - name: f-junioren-2016
                label: "F-Junioren 2016 (U10)"
                widget: object
                fields: *team_fields

              - name: f-junioren-2017
                label: "F-Junioren 2017 (U9)"
                widget: object
                fields: *team_fields

              - name: bambini-2018
                label: "Bambini 2018 (U8)"
                widget: object
                fields: *team_fields

              - name: bambini-2019
                label: "Bambini 2019 (U7)"
                widget: object
                fields: *team_fields

              - name: bambini-20202021
                label: "Bambini 2020/2021 (U6)"
                widget: object
                fields: *team_fields

              - name: bambini-20212022
                label: "Bambini 2021/2022 (U5)"
                widget: object
                fields: *team_fields

  # ── fussball.de Widget-IDs ───────────────────
  - name: fussball
    label: Fussball.de Widgets
    description: "Widget-IDs von fussball.de verwalten"
    files:
      - name: fussball_config
        label: Widget-Konfiguration
        file: data/fussball.json
        fields:
          - { name: seasonEnd,        label: Saisonende (Datum),    widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
          - { name: seasonEndMessage, label: Saisonende-Nachricht,  widget: string }
          - { name: clubMatchesWidget,label: Vereins-Widget ID,     widget: string }
